services:
  discord-bot:
    image: discord-bot:1.15.0
    container_name: discord-bot
    build:
      context: .
      dockerfile: Dockerfile

    # Автоматический перезапуск при ошибке и перезагрузке системы
    restart: unless-stopped

    environment:
      # Переменные окружения из .env
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}
      WEB_PORT: ${WEB_PORT:-8787}
      MUSIC_DEFAULT_VOLUME_PERCENT: ${MUSIC_DEFAULT_VOLUME_PERCENT:-100}
      MUSIC_FILE_MAX_BYTES: ${MUSIC_FILE_MAX_BYTES:-209715200}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
      REMOTE_ACCESS_PROVIDER: ${REMOTE_ACCESS_PROVIDER:-auto}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ACCESS_PUBLIC_BASE_URL: ${ACCESS_PUBLIC_BASE_URL:-}
      ACCESS_OWNER_EMAIL: ${ACCESS_OWNER_EMAIL:-rodionaustralia@gmail.com}
      ACCESS_OWNER_PRIORITY_MS: ${ACCESS_OWNER_PRIORITY_MS:-300000}
      PROJECT_IDENTITY_SECRET: ${PROJECT_IDENTITY_SECRET:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_DOMAIN_ID: ${NGROK_DOMAIN_ID:-}
      # Optional: internal URL of the bgutil PO Token Provider service.
      YTDLP_POT_PROVIDER_URL: ${YTDLP_POT_PROVIDER_URL:-}
      # Optional YouTube player client override (for example, web_embedded).
      YTDLP_PLAYER_CLIENT: ${YTDLP_PLAYER_CLIENT:-}
      # Internal self-hosted Cobalt API used by /download.
      COBALT_API_URL: ${COBALT_API_URL:-http://cobalt:9000/}
      COBALT_API_KEY: ${COBALT_API_KEY:-}
      DOWNLOAD_PUBLIC_BASE_URL: ${DOWNLOAD_PUBLIC_BASE_URL:-${ACCESS_PUBLIC_BASE_URL:-${PUBLIC_BASE_URL:-}}}
      DOWNLOAD_MAX_BYTES: ${DOWNLOAD_MAX_BYTES:-524288000}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-2}
      DOWNLOAD_QUEUE_MAX: ${DOWNLOAD_QUEUE_MAX:-20}
      DOWNLOAD_COOLDOWN_MS: ${DOWNLOAD_COOLDOWN_MS:-30000}
      DOWNLOAD_LINK_TTL_MS: ${DOWNLOAD_LINK_TTL_MS:-1800000}
      DOWNLOAD_TIMEOUT_MS: ${DOWNLOAD_TIMEOUT_MS:-600000}
      COBALT_MUSIC_MAX_BYTES: ${COBALT_MUSIC_MAX_BYTES:-209715200}
      COBALT_MUSIC_TIMEOUT_MS: ${COBALT_MUSIC_TIMEOUT_MS:-600000}
      TRANSCRIPTION_WORKER_URL: ${TRANSCRIPTION_WORKER_URL:-http://transcription-worker:8000}
      TRANSCRIPTION_WORKER_TIMEOUT_MS: ${TRANSCRIPTION_WORKER_TIMEOUT_MS:-180000}
      TRANSCRIPTION_CHUNK_MS: ${TRANSCRIPTION_CHUNK_MS:-60000}
      TRANSCRIPTION_CHUNK_OVERLAP_MS: ${TRANSCRIPTION_CHUNK_OVERLAP_MS:-1000}
      TRANSCRIPTION_JOB_ATTEMPTS: ${TRANSCRIPTION_JOB_ATTEMPTS:-3}
      TRANSCRIPTION_JOB_RETRY_DELAY_MS: ${TRANSCRIPTION_JOB_RETRY_DELAY_MS:-1000}
      TRANSCRIPTION_AUDIO_RETENTION_MS: ${TRANSCRIPTION_AUDIO_RETENTION_MS:-604800000}
      TRANSCRIPTION_MAX_ACTIVE: ${TRANSCRIPTION_MAX_ACTIVE:-1}
      TRANSCRIPTION_MAX_PENDING_CHUNKS: ${TRANSCRIPTION_MAX_PENDING_CHUNKS:-10}

    # Монтирование директорий для сохранения данных и конфига
    volumes:
      # Конфигурация сервера
      - ./config:/app/config
      # Данные (история сообщений, состояние плейлиста)
      - ./data:/app/data
      # Логи (опционально)
      - ./logs:/app/logs

    # Проксирование портов
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8787}:${WEB_PORT:-8787}"

    # Жёсткие ограничения работают и в обычном Docker Compose, не только в Swarm.
    mem_limit: ${BOT_MEMORY_LIMIT:-3g}
    mem_reservation: ${BOT_MEMORY_RESERVATION:-1g}
    cpus: ${BOT_CPU_LIMIT:-2.0}

    deploy:
      resources:
        limits:
          cpus: ${BOT_CPU_LIMIT:-2.0}
          memory: ${BOT_MEMORY_LIMIT:-3g}
        reservations:
          cpus: ${BOT_CPU_RESERVATION:-0.5}
          memory: ${BOT_MEMORY_RESERVATION:-1g}

    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    # Переменные для graceful shutdown
    stop_grace_period: 30s
    stop_signal: SIGTERM

    depends_on:
      cobalt:
        condition: service_started
      transcription-worker:
        condition: service_healthy

  transcription-worker:
    build:
      context: ./transcription-worker
      dockerfile: Dockerfile
    image: discord-bot-transcription-worker:small
    container_name: discord-bot-transcription-worker
    init: true
    restart: unless-stopped
    gpus: all
    environment:
      TRANSCRIPTION_DATA_ROOT: /data/transcriptions
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MODEL_REVISION: ${WHISPER_MODEL_REVISION:-536b0662742c02347bc0e980a01041f333bce120}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_MODEL_CACHE: /models
      WHISPER_LOCAL_FILES_ONLY: ${WHISPER_LOCAL_FILES_ONLY:-0}
      AEC_MIN_CORRELATION: ${AEC_MIN_CORRELATION:-0.12}
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - whisper-models:/models
    mem_limit: ${WHISPER_MEMORY_LIMIT:-4g}
    cpus: ${WHISPER_CPU_LIMIT:-4.0}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Cobalt is intentionally not published to the host or Internet. Only the
  # Discord bot can access it through the private Compose network.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: discord-bot-cobalt
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      DURATION_LIMIT: ${COBALT_DURATION_LIMIT:-10800}
      TUNNEL_LIFESPAN: ${COBALT_TUNNEL_LIFESPAN:-120}
      RATELIMIT_WINDOW: ${COBALT_RATELIMIT_WINDOW:-60}
      RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-120}
    expose:
      - "9000"
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    mem_limit: ${COBALT_MEMORY_LIMIT:-1g}
    cpus: ${COBALT_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # Optional yt-dlp PO Token Provider. Enable with COMPOSE_PROFILES=pot and
  # YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416 in .env.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: bgutil-provider
    profiles: ["pot"]
    init: true
    restart: unless-stopped
    expose:
      - "4416"
    mem_limit: ${POT_MEMORY_LIMIT:-512m}
    cpus: ${POT_CPU_LIMIT:-0.5}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Постоянный серверный доступ. Включается только профилем server:
  # DEPLOYMENT_MODE=server и COMPOSE_PROFILES=server,pot в .env.
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    container_name: discord-bot-cloudflared
    profiles: ["server"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      discord-bot:
        condition: service_healthy
    mem_limit: ${CLOUDFLARED_MEMORY_LIMIT:-256m}
    cpus: ${CLOUDFLARED_CPU_LIMIT:-0.25}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  default:
    driver: bridge

volumes:
  whisper-models:
